<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sem conexão</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif;
             background: linear-gradient(135deg, #660385, #AB00B3); color: #fff; text-align: center; padding: 24px; }
      h1 { font-size: 1.5rem; margin: 0 0 8px; }
      p { margin: 0 0 24px; opacity: .9; }
      button { font: inherit; font-weight: 700; border: 0; border-radius: 999px; padding: 12px 28px; min-height: 44px;
               background: #FDCB26; color: #2a0038; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Você está sem internet</h1>
      <p>Assim que a conexão voltar, o bloco continua de onde parou.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
